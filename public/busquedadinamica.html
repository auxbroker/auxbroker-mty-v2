<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AUXBROKER · Búsqueda dinámica</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    .card {
      max-width: 800px;
      margin: 12px auto;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background-color: #f9f9f9;
    }
    select, input {
      padding: 2px 4px;
      margin: 0 2px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: auto;
      display: inline-block;
    }
    button {
      margin-top: 10px;
      padding: 6px 12px;
      background-color: #007bff;
      color: #fff;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #resultadosBusqueda .card {
      margin-top: 8px;
      background-color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>AUXBROKER MONTERREY</h1>
  </header>

  <main>
    <section id="busquedaDinamica" class="card">
      <h2>🔎 Búsqueda dinámica</h2>

      <p>
        Busco quien 
        <select id="tipoRequerimiento" required>
          <option value="">Seleccione requerimiento</option>
          <option value="solicita">solicita</option>
          <option value="ofrece">ofrece</option>
        </select>
        <span id="inmuebleBox"></span>
        en 
        <select id="tipoOperacion" required>
          <option value="">Seleccione operación</option>
          <option value="renta">renta</option>
          <option value="venta">venta</option>
        </select>
        con precio entre 
        <input type="text" id="precioMin" placeholder="desde"> y 
        <input type="text" id="precioMax" placeholder="hasta">
        en el 
        <span id="municipioBox"></span>
      </p>

      <button id="btnBuscar">Buscar opciones</button>

      <div id="resultadosBusqueda"></div>
    </section>
  </main>

  <script type="module">
    import { supabase } from "/js/supabaseClient.js";
    import { mostrarOpcionesContacto } from "/js/contact-utils.js";

    let resultadosBase = [];
    let resultadosActuales = [];

    async function loadPartial(id, file) {
      const el = document.getElementById(id);
      if (!el) return;
      const resp = await fetch(file);
      const html = await resp.text();
      el.innerHTML = html;
    }

    loadPartial("inmuebleBox", "/public/partials/inmueble.html");
    loadPartial("municipioBox", "/public/partials/municipio.html");

    document.getElementById("btnBuscar").addEventListener("click", async () => {
      const tipoReqUI = document.getElementById("tipoRequerimiento").value;
      const tipoReq = (tipoReqUI === "solicita") ? "solicitud" : "ofrecimiento";

      const inmueble = document.getElementById("inmueble")?.value || "";
      const operacion = document.getElementById("tipoOperacion")?.value || "";
      const municipio = document.getElementById("municipio")?.value || "";

      const precioMin = parseFloat(document.getElementById("precioMin").value) || 0;
      const precioMax = parseFloat(document.getElementById("precioMax").value) || Number.MAX_SAFE_INTEGER;

      let query = supabase
        .from("bolsa")
        .select("*")
        .eq("estado", "activa")
        .eq("requerimiento", tipoReq)
        .eq("inmueble", inmueble)
        .eq("operacion", operacion);

      // 👇 Ajuste: si municipio es distinto de "na", filtramos; si es "na", no filtramos
      if (municipio && municipio.toLowerCase() !== "na") {
        query = query.eq("municipio", municipio);
      }

      const { data: resultados, error } = await query.order("id", { ascending: false });

      const contenedor = document.getElementById("resultadosBusqueda");
      contenedor.innerHTML = "";

      if (error) {
        contenedor.innerHTML = "<p>Error al ejecutar búsqueda.</p>";
        return;
      }

      if (!resultados || resultados.length === 0) {
        contenedor.innerHTML = "<p>No se encontraron coincidencias.</p>";
        return;
      }

      resultadosBase = resultados.filter((item) => {
        const precioMinBolsa = parseFloat(item.preciomin) || 0;
        const precioMaxBolsa = parseFloat(item.preciomax) || 0;

        const dentroDeRango =
          precioMinBolsa >= precioMin &&
          (precioMaxBolsa ? precioMaxBolsa <= precioMax : true);

        const presupuestoAbierto =
          tipoReq === "solicitud" &&
          precioMinBolsa === 1111 &&
          precioMaxBolsa === 1111;

        return dentroDeRango || presupuestoAbierto;
      });

      resultadosActuales = [...resultadosBase];
      mostrarResultados(resultadosActuales);
    });

    function aplicarFiltroPalabra(palabraClave) {
      const clave = palabraClave.trim().toLowerCase();
      if (!clave) {
        resultadosActuales = [...resultadosBase];
      } else {
        resultadosActuales = resultadosActuales.filter((item) =>
          item.masdetalle.toLowerCase().includes(clave)
        );
      }
      mostrarResultados(resultadosActuales);
    }

    function mostrarResultados(lista) {
      const contenedor = document.getElementById("resultadosBusqueda");
      contenedor.innerHTML = "";

      if (!lista || lista.length === 0) {
        contenedor.innerHTML = "<p>No se encontraron opciones con los filtros aplicados.</p>";
        return;
      }

      const filtroDiv = document.createElement("div");
      filtroDiv.className = "filtro-palabra";

      const inputClave = document.createElement("input");
      inputClave.type = "text";
      inputClave.placeholder = "Filtrar por palabra clave";
      inputClave.className = "palabraClave";

      const btnFiltrar = document.createElement("button");
      btnFiltrar.textContent = "🔍 Filtrar";
      btnFiltrar.className = "btn-filtrar";

      btnFiltrar.addEventListener("click", () => {
        aplicarFiltroPalabra(inputClave.value);
      });

      filtroDiv.appendChild(inputClave);
      filtroDiv.appendChild(btnFiltrar);
      contenedor.appendChild(filtroDiv);

      lista.forEach((item) => {
        const precioMinBolsa = parseFloat(item.preciomin) || 0;
        const precioMaxBolsa = parseFloat(item.preciomax) || 0;
        const esPresupuestoAbierto = precioMinBolsa === 1111 && precioMaxBolsa === 1111;

        const indicador = esPresupuestoAbierto ? "Presupuesto abierto" : "En el rango";

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <p><strong>Detalle:</strong> ${item.masdetalle || ""}</p>
          <p><strong>Fecha:</strong> ${item.fecha_alta || "Sin fecha"}</p>
          <p><em>${indicador}</em></p>
          <button class="btn-contactar">Contactar</button>
        `;

        card.querySelector(".btn-contactar").addEventListener("click", () => {
          mostrarOpcionesContacto(card, item.telefono, item.pais, item.masdetalle);
        });

        contenedor.appendChild(card);
      });
    }
  </script>
</body>
</html>
