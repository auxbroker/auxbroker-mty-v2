<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AUXBROKER MONTERREY - Alta de Solicitud</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
  <header>
    <h1>AUXBROKER MONTERREY</h1>
  </header>

  <main>
    <form id="form-solicitud">
      <h2>Alta de Solicitud</h2>

      <div class="field">
        <select id="operacion" required>
          <option value="">Seleccione operación</option>
          <option value="venta">Venta</option>
          <option value="renta">Renta</option>
        </select>
      </div>

      <div id="inmuebleBox" class="field"></div>
      <div id="municipioBox" class="field"></div>

      <div class="field">
        <textarea id="descripcion" rows="5" placeholder="Describa el inmueble y denote lo más relevante" required></textarea>
      </div>

      <div class="field">
        <input type="number" id="preciomin" placeholder="Precio mínimo" min="0">
        <input type="number" id="preciomax" placeholder="Precio máximo" min="0">
      </div>

      <div class="field">
        <textarea id="contenidoPrivado" rows="3" placeholder="Información privada (solo asesores suscritos)"></textarea>
      </div>

      <button type="submit">Registrar</button>
    </form>
  </main>

  <!-- Solo un script principal -->
  <script type="module" src="../js/solicitud.js"></script>
</body>
</html>
