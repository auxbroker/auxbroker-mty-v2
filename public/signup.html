<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AUXBROKER · Signup</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    .toggle-password {
      font-size: 13px;
      margin-top: 4px;
      cursor: pointer;
      display: inline-block;
    }
  </style>
</head>
<body>
  <header>
    <h1>AUXBROKER MONTERREY</h1>
  </header>

  <main>
    <form id="form-signup">
      <h2>Registro de usuario</h2>
      <div class="field">
        <input id="nombre" type="text" placeholder="Nombre completo" required>
      </div>
      <div class="field">
        <input id="telefono" type="text" placeholder="Teléfono" required>
      </div>
      <div class="field">
        <input id="correo" type="email" placeholder="Correo electrónico" required>
      </div>
      <div class="field">
        <input id="password" type="password" placeholder="Contraseña" required>
        <label class="toggle-password">
          <input type="checkbox" id="showPassword"> Mostrar contraseña
        </label>
      </div>
      <button type="submit">Registrarse</button>
    </form>
  </main>

  <script type="module">
    import { supabase } from "../js/supabaseClient.js";

    // 👇 Alternar visibilidad de la contraseña
    document.getElementById("showPassword").addEventListener("change", (e) => {
      const passwordInput = document.getElementById("password");
      passwordInput.type = e.target.checked ? "text" : "password";
    });

    document.getElementById("form-signup").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!nombre || !telefono || !correo || !password) {
        alert("Completa todos los campos.");
        return;
      }

      try {
        // Crear usuario en Supabase Auth con metadata
        const { data, error } = await supabase.auth.signUp({
          email: correo,
          password: password,
          options: {
            data: {
              nombre: nombre,
              telefono: telefono
            }
          }
        });

        if (error) {
          alert("❌ Error al registrar: " + error.message);
          return;
        }

        alert("✅ Usuario creado. Revisa tu correo y confirma tu cuenta antes de iniciar sesión.");

        // Guardar datos en localStorage para usarlos en alta-suscriptores
        localStorage.setItem("correoAsesor", correo);
        localStorage.setItem("nombreAsesor", nombre);
        localStorage.setItem("telefonoAsesor", telefono);

        // Redirigir a alta-suscriptores.html
        window.location.href = "suscriptores.html";
      } catch (err) {
        alert("❌ Error inesperado: " + err.message);
        console.error(err);
      }
    });
  </script>
</body>
</html>
