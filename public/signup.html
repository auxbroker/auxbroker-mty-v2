<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AUXBROKER · Signup</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: 100%;
      max-width: 1200px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    form {
      width: 100%;
    }
    .field {
      margin-bottom: 12px;
    }
    .toggle-password {
      font-size: 13px;
      margin-top: 4px;
      cursor: pointer;
      display: inline-block;
    }
    .terms-container {
      margin-top: 15px;
      width: 100%;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
      height: 400px;          /* altura fija con scroll */
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 15px;
      background: #fff;
    }
    .terms-box {
      margin-top: 10px;
      font-size: 14px;
      text-align: center;
    }
    button[disabled] {
      background-color: #aaa;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      main {
        max-width: 95%;
        padding: 15px;
      }
      .terms-container {
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>AUXBROKER MONTERREY</h1>
  </header>

  <main>
    <form id="form-signup">
      <h2>Registro de usuario</h2>
      <div class="field">
        <input id="nombre" type="text" placeholder="Nombre completo" required>
      </div>
      <div class="field">
        <input id="telefono" type="text" placeholder="Teléfono" required>
      </div>
      <div class="field">
        <input id="correo" type="email" placeholder="Correo electrónico" required>
      </div>
      <div class="field">
        <input id="password" type="password" placeholder="Contraseña" required>
        <label class="toggle-password">
          <input type="checkbox" id="showPassword"> Mostrar contraseña
        </label>
      </div>

      <!-- Bloque de términos scrollable -->
      <div class="terms-container" id="termsContainer">
        <div id="termsContent"><!-- Aquí se cargará dinámicamente el contenido de terminos.html --></div>
      </div>

      <div class="terms-box">
        <input type="checkbox" id="aceptaTerminos" disabled>
        <label for="aceptaTerminos">He leído y acepto los términos y condiciones.</label>
      </div>

      <button type="submit" id="btnSignup" disabled>Registrarse</button>
    </form>
  </main>

  <script type="module" src="../js/signup.js"></script>
</body>
</html>
